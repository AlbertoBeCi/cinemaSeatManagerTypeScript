<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestor de Asientos — Cine</title>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-900">
    <header class="mx-auto max-w-3xl px-6 pt-8 text-center">
      <h1 class="text-3xl font-bold tracking-tight">Gestor de Asientos</h1>
      <p class="mt-1 text-sm text-slate-500">Haz clic en un asiento libre para reservarlo</p>
    </header>

    <main class="mx-auto flex max-w-3xl flex-col items-center gap-6 px-6 py-8">
      <section aria-label="Estadísticas de la sala" class="w-full rounded-xl border border-slate-200 bg-white px-6 py-4 shadow-sm">
        <dl class="flex justify-center gap-10 text-center">
          <div>
            <dt class="text-xs font-medium uppercase tracking-wide text-slate-500">Disponibles</dt>
            <dd id="contador-disponibles" class="text-2xl font-bold text-emerald-600">0</dd>
          </div>
          <div>
            <dt class="text-xs font-medium uppercase tracking-wide text-slate-500">Ocupados</dt>
            <dd id="contador-ocupados" class="text-2xl font-bold text-rose-600">0</dd>
          </div>
        </dl>
      </section>

      <section aria-labelledby="mapa-heading" class="w-full rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
        <h2 id="mapa-heading" class="sr-only">Mapa de asientos</h2>

        <div class="mx-auto mb-2 h-2 w-4/5 rounded-full bg-slate-300 shadow-inner" aria-hidden="true"></div>
        <p class="mb-6 text-center text-xs font-medium uppercase tracking-widest text-slate-400" aria-hidden="true">
          Pantalla
        </p>

        <div
          id="mapa-asientos"
          class="mx-auto grid w-fit gap-2"
          role="grid"
          aria-label="Asientos de la sala"
        ></div>

        <div class="mt-6 flex items-center justify-center gap-6 text-sm text-slate-600">
          <span class="flex items-center gap-2">
            <span class="h-4 w-4 rounded border border-emerald-400 bg-emerald-100" aria-hidden="true"></span>
            Libre
          </span>
          <span class="flex items-center gap-2">
            <span class="h-4 w-4 rounded bg-rose-500" aria-hidden="true"></span>
            Ocupado
          </span>
        </div>
      </section>

      <p id="mensaje-estado" role="status" aria-live="polite" class="min-h-[1.5rem] text-sm font-medium text-slate-700"></p>

      <div class="flex gap-3">
        <button
          id="btn-contiguos"
          type="button"
          class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 shadow-sm transition-colors hover:bg-slate-50"
        >
          Buscar 2 asientos juntos
        </button>
        <button
          id="btn-reiniciar"
          type="button"
          class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-medium text-white shadow-sm transition-colors hover:bg-slate-800"
        >
          Nueva sala
        </button>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
